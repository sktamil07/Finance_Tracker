# Render Blueprint for Finance Tracker.
#
# ONE web service: the multi-stage Dockerfile builds the Expo web UI, bakes it
# into the Spring Boot JAR, and the container serves the UI at / and the API at
# /api/v1 on the same origin. Plus a managed PostgreSQL 16 instance whose
# credentials are wired into the app automatically.
#
# Apply it from the Render dashboard: New > Blueprint, then point at this repo.

databases:
  - name: finance-tracker-db
    databaseName: finance_tracker
    user: finance
    plan: free

services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # /v3/api-docs is in SecurityConfig.PUBLIC_PATHS, so it answers without a JWT.
    healthCheckPath: /v3/api-docs
    envVars:
      # prod => Flyway on, ddl-auto: validate, demo seeder OFF, show-sql off.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # application.yml builds the JDBC URL from these four, so the managed
      # database's own values drop straight in. Keep the DB and the service in
      # the same region or the internal hostname will not resolve.
      - key: DB_HOST
        fromDatabase:
          name: finance-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finance-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finance-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: finance-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-tracker-db
          property: password

      # HS256 needs >= 32 bytes. The prod profile has NO fallback on purpose, so
      # the app refuses to boot if this is missing.
      - key: JWT_SECRET
        generateValue: true

      # UI and API share one origin, so CORS only matters if some OTHER origin
      # calls the API. Optional — set it in the dashboard if needed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Free instances are 512 MB; let the JVM size its heap to the container.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0
