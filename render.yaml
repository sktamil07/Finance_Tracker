# Render Blueprint for the Finance Tracker API.
#
# Deploys the Spring Boot backend from the multi-stage Dockerfile plus a managed
# PostgreSQL 16 instance, and wires the DB credentials into the app automatically.
#
# Apply it from the Render dashboard: New > Blueprint, then point at this repo.
# Note this is the BACKEND only; `mobile/` is excluded via .dockerignore.

databases:
  - name: finance-tracker-db
    databaseName: finance_tracker
    user: finance
    plan: free

services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # /v3/api-docs is in SecurityConfig.PUBLIC_PATHS, so it answers without a JWT.
    healthCheckPath: /v3/api-docs
    envVars:
      # prod => Flyway on, ddl-auto: validate, demo seeder OFF, show-sql off.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # application.yml builds the JDBC URL from these four, so the managed
      # database's own values drop straight in. Keep the DB and the service in
      # the same region or the internal hostname will not resolve.
      - key: DB_HOST
        fromDatabase:
          name: finance-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finance-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finance-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: finance-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-tracker-db
          property: password

      # HS256 needs >= 32 bytes. The prod profile has NO fallback on purpose, so
      # the app refuses to boot if this is missing.
      - key: JWT_SECRET
        generateValue: true

      # sync: false => set this in the dashboard, not in git.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Free instances are 512 MB; let the JVM size its heap to the container.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0

  # ---- Frontend: the Expo app exported as a static web bundle ----
  # The mobile/ app is React Native; `expo export --platform web` produces a
  # plain static site in mobile/dist that Render can serve. This is what puts a
  # UI on a URL — the API service above serves JSON only and has no pages.
  - type: web
    name: finance-tracker-web
    runtime: static
    buildCommand: cd mobile && npm ci && npx expo export --platform web
    staticPublishPath: mobile/dist
    envVars:
      # Metro inlines EXPO_PUBLIC_* at build time, so this must be set here.
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://finance-tracker-z1kg.onrender.com/api/v1
    routes:
      # Single-page app: send every unknown path to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
