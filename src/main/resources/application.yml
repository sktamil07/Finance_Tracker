server:
  # Render and similar hosts inject PORT; fall back to SERVER_PORT, then 8099.
  port: ${PORT:${SERVER_PORT:8099}}

spring:
  application:
    name: finance-tracker

  # Local runs default to `dev` (seeds demo data). Override in prod with the
  # SPRING_PROFILES_ACTIVE env var or --spring.profiles.active=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_tracker}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:change-me-locally}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Never `update` outside the throwaway `local` profile.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: '*'
    allow-credentials: true
    max-age: 3600
  jwt:
    # No default on purpose: startup must fail loudly if the signing key is not provided.
    secret: ${JWT_SECRET}
    issuer: finance-tracker
    access-token-ttl: PT15M
    refresh-token-ttl: P7D

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

app:
  seed:
    enabled: true
  jwt:
    # Dev-only fallback so `./mvnw spring-boot:run` works with no env vars.
    # NEVER used in prod: the base profile has no default, so prod fails loudly
    # unless a real JWT_SECRET is supplied.
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-change-me-0123456789}

logging:
  level:
    com.financetracker: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  seed:
    enabled: false

---
# THROWAWAY LOCAL PROFILE ONLY.
# Flyway off + ddl-auto: update. Never point this at a database you care about.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  seed:
    enabled: false
