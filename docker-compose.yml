# Local MySQL 8 for development. Not used by the tests — those spin up their own
# throwaway MySQL container via Testcontainers.
services:
  mysql:
    image: mysql:8.0
    container_name: finance-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-finance_tracker}
      MYSQL_USER: ${DB_USERNAME:-finance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - finance-tracker-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  finance-tracker-mysql-data:
